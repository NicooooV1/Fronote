name: validate

on:
  push:
    branches: [main, 'chore/**', 'feat/**', 'release/**']
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: PHP syntax + JSON manifests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.0 retiré : le code utilise des propriétés readonly promues (syntaxe PHP 8.1+),
        # le job 8.0 échouait donc systématiquement au lint.
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, zip, json, pdo_mysql, pdo_sqlite, mbstring, openssl
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev

      - name: Security audit of dependencies
        run: composer audit

      - name: Provision a minimal .env for bootstrap
        run: cp .env.ci.example .env

      - name: PHP -l on all PHP files
        run: |
          set -e
          find . -path ./vendor -prune -o -name '*.php' -print | while read -r f; do
            php -l "$f" >/dev/null
          done

      - name: Validate every module.json
        run: php tests/validate_manifests.php

      - name: FmodService end-to-end self-test (keygen → cert → build → verify)
        run: php tests/fmod_selftest.php

      - name: FmodService unit tests (pure, no DB)
        run: php tests/fmod_unit.php

      - name: Multi-establishment scoping lint
        run: php tests/scoping_lint.php

  module-sdk:
    name: ModuleSDK smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: sodium, zip, json, pdo_mysql, pdo_sqlite, mbstring
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev
      - name: Provision a minimal .env for bootstrap
        run: cp .env.ci.example .env
      - name: Module discovery + manifest validation
        run: php tests/module_sdk_smoke.php

  tests:
    name: PHPUnit (unit + intégration MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: fronote_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sodium, zip, json, pdo, pdo_mysql, pdo_sqlite, mbstring
          coverage: none
          tools: composer:v2
      - name: Install dependencies (with dev)
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Provision .env (MySQL CI) — active les tests d'isolation/backup/sécurité
        run: cp .env.ci.example .env
      - name: Charger le schéma
        run: mysql -h 127.0.0.1 -P 3306 -uroot fronote_ci < pronote.sql || true
      - name: Run tests (unit + intégration DB)
        run: vendor/bin/phpunit --testsuite unit

  websocket-audit:
    name: WebSocket deps audit (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: npm audit (websocket)
        working-directory: websocket
        # Bloquant : une vulnérabilité high/critical dans les deps WS fait échouer le build.
        run: npm audit --omit=dev --audit-level=high

  static-analysis:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-latest
    # Bloquant : la baseline (phpstan-baseline.neon) fige la dette existante ;
    # toute NOUVELLE erreur de typage fait échouer le build.
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sodium, zip, json, pdo, pdo_mysql, mbstring
          coverage: none
          # Version épinglée : garantit que la CI applique exactement la même
          # analyse que la baseline (phpstan-baseline.neon) régénérée localement.
          tools: composer:v2, phpstan:2.2.8
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev
      - name: Provision a minimal .env for bootstrap
        run: cp .env.ci.example .env
      - name: PHPStan
        run: phpstan analyse --no-progress
