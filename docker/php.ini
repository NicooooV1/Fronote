; Fronote — réglages PHP pour conteneur de production
; Copié dans /usr/local/etc/php/conf.d/ par le Dockerfile.

; --- OPcache ---
opcache.enable=1
opcache.enable_cli=0
; Code figé dans l'image : pas de revalidation des timestamps (perf).
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; --- Erreurs : jamais affichées au navigateur en production ---
display_errors=Off
display_startup_errors=Off
log_errors=On

; --- Limites raisonnables pour imports/exports/PDF ---
upload_max_filesize=32M
post_max_size=40M
memory_limit=256M
max_execution_time=120

; --- Durcissement sécurité ---
expose_php=Off
session.use_strict_mode=On
session.cookie_httponly=On
session.cookie_samesite=Lax
; À activer dès que le site est servi en HTTPS (cf. cutover TLS) :
;session.cookie_secure=On
